[project]
name = "docweave"
version = "0.1.0"
description = "Document processing built on a local BabelDOC fork"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "BabelDOC==0.6.4",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
docweave = "docweave.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docweave"]

[tool.uv.sources]
babeldoc = { path = "third_party/BabelDOC", editable = true }

[tool.pyright]
extraPaths = ["src", "third_party/BabelDOC"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
extend-exclude = ["third_party"]
